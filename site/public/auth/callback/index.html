<!doctype html>
<!--
  Where GitHub and Google sign-in come back to. Supabase sends the browser here with the PKCE code, and the
  page hands it to Flux at flux://auth/callback with the same query, so the browser lands on a page
  that says what happened rather than staying on the provider's consent screen. It keeps nothing: the
  code is only good with the verifier on the Mac that asked for it.

  The answer is a dialog as the app draws its dialogs, over the background of the sign-in screen's
  panel: the logo's colours drifting as an aurora, and streams of light flowing like lines of logs.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#111214" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Signed in · Flux</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* src/index.css, Islands Dark: the sign-in panel is dark whatever the theme, and so is this */
      :root {
        --font-ui: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        --bg-window: #111214;
        --bg-editor: #1e1f22;
        --bg-tool: #26282c;
        --bg-raised: #393b40;
        --bg-input: #1e1f22;
        --bg-hover: #303236;
        --sel-focus: #2f5aa8;
        --border: #303337;
        --border-soft: #26282c;
        --stripe-active: #33363b;
        --island-radius: 12px;
        --text: #dfe1e5;
        --text-dim: #9da0a8;
        --text-muted: #6f737a;
        --accent: #3574f0;
        --accent-text: #ffffff;
        --green: #5fad65;
        --red: #e55765;
        --cyan: #56a8f5;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: linear-gradient(160deg, #15171c 0%, #0d0e11 60%, #0b0c0f 100%);
        color: var(--text);
        font: 13px/1.4 var(--font-ui);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      /* AuthGate.tsx's Streams: three lights that never quite settle, and streams that drift */
      .backdrop {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .aurora {
        position: absolute;
        border-radius: 50%;
        animation: aurora 24s ease-in-out infinite;
      }
      .backdrop > svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        animation: stream 14s ease-in-out infinite alternate;
        will-change: transform;
      }
      .flow {
        animation: flow 8s linear infinite;
      }
      .fade {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(11, 12, 15, 0.55) 0%, transparent 30%, transparent 60%, rgba(11, 12, 15, 0.85) 100%);
      }
      .brand {
        position: fixed;
        top: 40px;
        left: 48px;
        display: flex;
        align-items: center;
        gap: 12px;
        color: #e8e9ec;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .privacy {
        position: fixed;
        right: 0;
        bottom: 32px;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 16px;
        color: var(--text-muted);
        font-size: 11.5px;
        text-align: center;
      }

      /* ContextMenu.tsx's ConfirmDialog: the backdrop, the box, its title, message and buttons */
      .modal {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .dialog {
        width: 440px;
        min-width: 0;
        max-width: 100%;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--bg-tool);
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
        user-select: text;
        animation: in 360ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .dialog .title {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        font-size: 13px;
        font-weight: 600;
      }
      .dialog .message {
        margin: 6px 0 0;
        color: var(--text-dim);
        font-size: 13px;
      }
      /* what has happened, as the app lists rows: 24px each, an icon, a label, a quiet value */
      .steps {
        margin-top: 12px;
        padding: 4px 0;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg-input);
      }
      .step {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 24px;
        padding: 0 10px;
      }
      .step .mark {
        display: grid;
        place-items: center;
        width: 16px;
        height: 16px;
      }
      .step .label {
        flex: 1;
        min-width: 0;
      }
      .step .value {
        color: var(--text-muted);
        font-family: var(--font-mono);
        font-size: 11px;
      }
      .step[data-state="waiting"] .label {
        color: var(--text-muted);
      }
      .step .mark svg {
        display: none;
      }
      .step[data-state="done"] .done,
      .step[data-state="working"] .spin,
      .step[data-state="waiting"] .wait {
        display: block;
      }
      .spin {
        animation: spin 900ms linear infinite;
      }
      .problem {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        padding: 8px 10px;
        border: 1px solid color-mix(in srgb, var(--red) 40%, var(--border));
        border-radius: 4px;
        background: color-mix(in srgb, var(--red) 8%, var(--bg-input));
        color: var(--text);
        font-size: 12px;
      }
      .problem code {
        font-family: var(--font-mono);
        font-size: 11.5px;
        word-break: break-word;
      }
      .buttons {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 16px;
      }
      .buttons .note {
        min-width: 0;
        margin-right: auto;
        color: var(--text-muted);
        font-size: 11px;
      }
      /* settings/controls.tsx's Button */
      .button {
        display: inline-flex;
        align-items: center;
        height: 26px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg-raised);
        color: var(--text);
        font: inherit;
        font-size: 13px;
        text-decoration: none;
        white-space: nowrap;
        cursor: default;
      }
      .button:hover {
        background: var(--bg-hover);
      }
      .button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--accent-text);
      }
      .button.primary:hover {
        filter: brightness(1.08);
      }

      /* what each state leaves out */
      .failed .steps,
      .failed .ok,
      .idle .steps,
      .idle .note,
      body:not(.failed) .problem,
      body:not(.failed) .no {
        display: none;
      }

      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(6px) scale(0.99);
        }
      }
      @keyframes aurora {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(6%, 4%) scale(1.12);
        }
      }
      @keyframes stream {
        0% {
          transform: translate(0, 0);
        }
        33% {
          transform: translate(-70px, 10px);
        }
        66% {
          transform: translate(-130px, -8px);
        }
        100% {
          transform: translate(-190px, 4px);
        }
      }
      @keyframes flow {
        from {
          stroke-dashoffset: 1000;
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .dialog,
        .spin,
        .aurora,
        .flow,
        .backdrop > svg {
          animation: none;
        }
      }
      @media (max-width: 560px) {
        .brand {
          top: 24px;
          left: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true">
      <div
        class="aurora"
        style="
          top: -25%;
          left: -25%;
          width: 85vmax;
          height: 85vmax;
          background: radial-gradient(circle, #22c8b266, transparent 62%);
          filter: blur(90px);
        "
      ></div>
      <div
        class="aurora"
        style="
          top: 33%;
          right: -25%;
          width: 70vmax;
          height: 70vmax;
          background: radial-gradient(circle, #3b6cf066, transparent 62%);
          filter: blur(100px);
          animation-delay: -9s;
        "
      ></div>
      <div
        class="aurora"
        style="
          bottom: -33%;
          left: 20%;
          width: 65vmax;
          height: 65vmax;
          background: radial-gradient(circle, #7b4fd655, transparent 62%);
          filter: blur(110px);
          animation-delay: -17s;
        "
      ></div>
      <svg width="0" height="0" style="position: absolute">
        <defs>
          <linearGradient id="stream" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" stop-color="#22c8b2" stop-opacity="0" />
            <stop offset="0.35" stop-color="#22c8b2" stop-opacity="1" />
            <stop offset="0.7" stop-color="#8cf7e2" stop-opacity="0.9" />
            <stop offset="1" stop-color="#3b6cf0" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="teal" x1="6" y1="2" x2="122" y2="126" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#8CF7E2" />
            <stop offset="0.35" stop-color="#22C8B2" />
            <stop offset="0.72" stop-color="#109AA0" />
            <stop offset="1" stop-color="#0A6180" />
          </linearGradient>
        </defs>
      </svg>
      <!-- the streams are drawn by the script, the way the sign-in screen draws them -->
      <div class="fade" id="fade"></div>
    </div>

    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 128 128" aria-hidden="true">
        <rect width="128" height="128" rx="29" fill="url(#teal)" />
        <rect x="14" y="14" width="100" height="100" rx="15" fill="#111214" />
        <path d="M46 40H82V52H57V58H75V69H57V87H46Z" fill="#ffffff" />
      </svg>
      Flux
    </div>

    <!-- the answer, as the app draws a dialog -->
    <div class="modal">
      <section class="dialog" role="dialog" aria-labelledby="title" aria-live="polite">
        <p class="title" id="heading">
          <svg
            class="ok"
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="var(--green)"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="9.5" stroke-width="2" />
            <path d="m8 12.3 2.7 2.7L16 9.6" />
          </svg>
          <svg class="no" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="9.5" />
            <path d="m15 9-6 6M9 9l6 6" />
          </svg>
          <span id="title">Signed in</span>
        </p>
        <p class="message" id="message">Flux is opening to finish signing you in.</p>

        <div class="steps">
          <div class="step" data-state="done">
            <span class="mark"></span>
            <span class="label" id="confirmed">Your account was confirmed</span>
            <span class="value">oauth</span>
          </div>
          <div class="step" data-state="working" id="handoff">
            <span class="mark"></span>
            <span class="label" id="handoff-label">Handing the session to Flux</span>
            <span class="value">pkce</span>
          </div>
          <div class="step" data-state="waiting" id="ready">
            <span class="mark"></span>
            <span class="label">Back in the app</span>
            <span class="value" id="ready-value">—</span>
          </div>
        </div>

        <div class="problem">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="var(--red)"
            stroke-width="2"
            stroke-linecap="round"
            style="margin-top: 1px"
          >
            <path d="M12 9v4M12 17h.01" />
            <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z" />
          </svg>
          <span><span id="said">The provider said</span>: <code id="reason"></code></span>
        </div>

        <div class="buttons">
          <span class="note" id="note">Asked to open Flux? Allow it.</span>
          <button class="button" id="close" type="button">Close Tab</button>
          <a class="button primary" id="open" href="flux://auth/callback">Open Flux</a>
        </div>
      </section>
    </div>

    <p class="privacy">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <rect x="4" y="11" width="16" height="10" rx="2" />
        <path d="M8 11V7a4 4 0 0 1 8 0v4" />
      </svg>
      This page keeps nothing. Connections, tokens and queries never leave your Mac.
    </p>

    <script>
      const $ = (id) => document.getElementById(id);
      // AuthGate.tsx's Streams, the same curves: a wave through points, smoothed Catmull–Rom
      const smooth = (pts) => {
        const out = [`M${pts[0][0]},${pts[0][1].toFixed(1)}`];
        for (let i = 0; i < pts.length - 1; i++) {
          const [p0, p1, p2, p3] = [pts[i - 1] ?? pts[i], pts[i], pts[i + 1], pts[i + 2] ?? pts[i + 1]];
          const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
          const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
          out.push(`C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0]},${p2[1].toFixed(1)}`);
        }
        return out.join(" ");
      };
      const wave = (y, amp, phase) => {
        const pts = [];
        for (let x = -200; x <= 1400; x += 40) pts.push([x, y + Math.sin(x / 210 + phase) * amp + Math.sin(x / 97 + phase * 1.7) * amp * 0.22]);
        return smooth(pts);
      };
      const NS = "http://www.w3.org/2000/svg";
      const make = (tag, attrs) => {
        const el = document.createElementNS(NS, tag);
        for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
        return el;
      };
      for (let i = 0; i < 14; i++) {
        const d = wave(240 + i * 27, 48 + (i % 4) * 10, i * 0.42);
        const width = i % 5 === 2 ? 1.6 : 0.85;
        // each stream its own layer, moved by the compositor
        const layer = make("svg", { viewBox: "0 0 1200 900", preserveAspectRatio: "xMidYMid slice" });
        layer.style.animationDuration = `${11 + (i % 6) * 2.5}s`;
        layer.style.animationDelay = `${-i * 1.7}s`;
        layer.append(
          make("path", {
            d,
            fill: "none",
            stroke: "url(#stream)",
            "stroke-width": width,
            "stroke-opacity": 0.12 + (i % 5 === 2 ? 0.32 : (i % 3) * 0.06),
            "stroke-linecap": "round",
          }),
        );
        // every third stream carries a light along it
        if (i % 3 === 1) {
          for (const l of [
            { w: width + 4, o: 0.14 },
            { w: width + 0.9, o: 0.6 },
          ]) {
            const light = make("path", {
              d,
              fill: "none",
              stroke: "#8cf7e2",
              "stroke-width": l.w,
              "stroke-opacity": l.o,
              "stroke-linecap": "round",
              pathLength: 1000,
              "stroke-dasharray": "70 930",
              class: "flow",
            });
            light.style.animationDuration = `${7 + (i % 4) * 1.6}s`;
            light.style.animationDelay = `${-i * 0.9}s`;
            layer.append(light);
          }
        }
        $("fade").before(layer);
      }

      // the query Supabase sent, as it is: a code, or an error and its description
      const query = new URLSearchParams(location.search);
      const target = "flux://auth/callback" + location.search + location.hash;
      const code = query.get("code");
      const failed = query.get("error_description") || query.get("error");
      const svg = (attrs, ...children) => {
        const el = document.createElementNS("http://www.w3.org/2000/svg", children.length ? "svg" : attrs.tag);
        for (const [k, v] of Object.entries(attrs)) if (k !== "tag") el.setAttribute(k, v);
        el.append(...children);
        return el;
      };

      // each step's three marks: done, working (the app's Spinner) and waiting
      for (const slot of document.querySelectorAll(".mark")) {
        const box = { width: "14", height: "14", viewBox: "0 0 24 24", fill: "none" };
        slot.append(
          svg(
            { ...box, class: "done", stroke: "var(--green)", "stroke-width": "2.6", "stroke-linecap": "round", "stroke-linejoin": "round" },
            svg({ tag: "path", d: "M5 12.5l4.5 4.5L19 7.5" }),
          ),
          svg(
            { ...box, class: "spin", "stroke-width": "2.4", "stroke-linecap": "round" },
            svg({ tag: "circle", cx: "12", cy: "12", r: "9", stroke: "var(--text-muted)", opacity: "0.3" }),
            svg({ tag: "path", d: "M12 3a9 9 0 0 1 9 9", stroke: "var(--accent)" }),
          ),
          svg({ ...box, class: "wait", stroke: "var(--text-muted)", "stroke-width": "2" }, svg({ tag: "circle", cx: "12", cy: "12", r: "8" })),
        );
      }

      // which provider it was, as Flux named it in the address it asked to come back to
      const provider = { github: "GitHub", google: "Google" }[query.get("via")];
      // connecting a provider to an account from Settings › Account comes back the same way
      const linking = query.get("link") === "1";
      if (provider) {
        $("title").textContent = linking ? `${provider} connected` : `Signed in with ${provider}`;
        if (linking) $("message").textContent = "Flux is adding it to your account.";
        $("confirmed").textContent = `${provider} confirmed your account`;
        $("said").textContent = `${provider} said`;
      }

      $("open").href = target;
      $("close").onclick = () => {
        window.close();
        // a tab the page did not open cannot be closed by it; say how instead
        setTimeout(() => ($("note").textContent = "Close this tab with ⌘W."), 150);
      };

      if (failed) {
        document.body.classList.add("failed");
        document.title = "Sign-in failed · Flux";
        $("title").textContent = "Sign-in didn't finish";
        $("message").textContent = "Nothing was saved. Go back to Flux and sign in again.";
        // text, never markup: the description comes from the address bar
        $("reason").textContent = failed.replace(/\+/g, " ");
        $("open").textContent = "Back to Flux";
        $("note").textContent = "";
      } else if (!code) {
        document.body.classList.add("idle");
        document.title = "Flux";
        $("title").textContent = "Nothing to finish here";
        $("message").textContent = "This page completes a GitHub or Google sign-in started in Flux. Start one from its sign-in screen.";
      }

      if (code || failed) location.href = target;

      // the browser hands the link to macOS and the page loses focus: that is Flux coming forward
      if (code) {
        const started = Date.now();
        let done = false;
        const arrived = () => {
          if (done || (document.visibilityState !== "hidden" && document.hasFocus())) return;
          done = true;
          $("handoff").dataset.state = "done";
          $("handoff-label").textContent = "Session handed to Flux";
          $("ready").dataset.state = "done";
          $("ready-value").textContent = ((Date.now() - started) / 1000).toFixed(1) + "s";
          $("message").textContent = "You're signed in. This tab can be closed.";
          $("note").textContent = "";
        };
        window.addEventListener("blur", () => setTimeout(arrived, 120));
        document.addEventListener("visibilitychange", arrived);
      }
    </script>
  </body>
</html>
