[package]
name = "flux"
version = "0.7.0"
description = "The modern log explorer, for Graylog"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
# macOS names an unbundled process after its executable file, so this is what `make dev`
# shows in the Dock and the menu bar. The bundle reads CFBundleName instead, which is why
# the two disagreed while the binary was called `flux`.
name = "Flux"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = "2.6.1"
tauri-plugin-store = "2.4.5"
keyring = "4.2.0"
portable-pty = "0.9.0"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
# the window comes back the size and the place it was left, which is the plugin's whole job
tauri-plugin-window-state = "2"
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
tokio = { version = "1.53.1", features = ["rt", "net", "macros", "sync", "time"] }
http-body-util = "0.1.5"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
