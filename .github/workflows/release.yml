name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Refuse a tag that disagrees with package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node scripts/version.mjs)"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $pkg; run 'make bump-*' which tags for you"
            exit 1
          fi

      - name: Quality gate
        run: |
          pnpm typecheck
          pnpm lint
          pnpm format:check
          cd src-tauri && cargo fmt --check && cargo clippy --all-targets -- -D warnings

      - name: Build
        run: pnpm tauri build --bundles app,dmg

      - name: Package the .app
        run: |
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --keepParent Flux.app "Flux-${GITHUB_REF_NAME}-macos.zip"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/macos/Flux-*-macos.zip
            src-tauri/target/release/bundle/dmg/*.dmg
