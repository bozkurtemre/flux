name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Refuse a tag that disagrees with package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node scripts/version.mjs)"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $pkg; run 'make bump-*' which tags for you"
            exit 1
          fi

      - name: Quality gate
        run: |
          pnpm typecheck
          pnpm lint
          pnpm format:check
          pnpm test
          cd src-tauri && cargo fmt --check && cargo clippy --all-targets -- -D warnings

      # Signed and notarized when the secrets exist, unsigned when they do not. A missing
      # secret arrives as an empty string, and an empty APPLE_CERTIFICATE is worse than no
      # certificate at all: Tauri sees the variable, imports nothing, and fails the build.
      # So the variables are only exported once there is something in them.
      - name: Build
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CERTIFICATE" ]; then
            export APPLE_CERTIFICATE="$CERTIFICATE"
            export APPLE_CERTIFICATE_PASSWORD="$CERTIFICATE_PASSWORD"
            export APPLE_SIGNING_IDENTITY="$SIGNING_IDENTITY"
            echo "signing with $SIGNING_IDENTITY"
          else
            echo "no signing certificate in this repository: building unsigned"
          fi
          if [ -n "$NOTARY_ID" ] && [ -n "$NOTARY_PASSWORD" ] && [ -n "$NOTARY_TEAM" ]; then
            export APPLE_ID="$NOTARY_ID"
            export APPLE_PASSWORD="$NOTARY_PASSWORD"
            export APPLE_TEAM_ID="$NOTARY_TEAM"
          fi
          pnpm tauri build --bundles app,dmg

      - name: Package the .app
        run: |
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --keepParent Flux.app "Flux-${GITHUB_REF_NAME}-macos.zip"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/macos/Flux-*-macos.zip
            src-tauri/target/release/bundle/dmg/*.dmg
