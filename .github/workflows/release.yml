name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Releases are made from a Mac with `make release-local`, which signs with the Developer ID and
# notarizes. A tag push starts this workflow too, and on 2026-10-16 it published an unsigned
# 0.38.0 over the signed one (docs/adr/0013). It runs only when the repository variable
# RELEASE_FROM_ACTIONS is "true", and even then refuses to build without the signing and
# notarizing secrets: there is no unsigned release.
jobs:
  release:
    name: Build and publish
    if: vars.RELEASE_FROM_ACTIONS == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Refuse a tag that disagrees with package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node scripts/version.mjs)"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $pkg; run 'make bump-*' which tags for you"
            exit 1
          fi

      - name: Quality gate
        run: |
          pnpm typecheck
          pnpm lint
          pnpm format:check
          pnpm test
          cd src-tauri && cargo fmt --check && cargo clippy --all-targets -- -D warnings

      # Signed with the Developer ID and notarized, or not built at all: every secret below must
      # be there, and a missing one stops the release before anything is built or published.
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in CERTIFICATE CERTIFICATE_PASSWORD SIGNING_IDENTITY NOTARY_ID NOTARY_PASSWORD NOTARY_TEAM TAURI_SIGNING_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set: a release is signed and notarized or it is not made (docs/adr/0013)" >&2
              exit 1
            fi
          done
          export APPLE_CERTIFICATE="$CERTIFICATE"
          export APPLE_CERTIFICATE_PASSWORD="$CERTIFICATE_PASSWORD"
          export APPLE_SIGNING_IDENTITY="$SIGNING_IDENTITY"
          export APPLE_ID="$NOTARY_ID"
          export APPLE_PASSWORD="$NOTARY_PASSWORD"
          export APPLE_TEAM_ID="$NOTARY_TEAM"
          echo "signing with $SIGNING_IDENTITY"
          # both architectures in one package, and the updater artifacts alongside it. The
          # flag is passed here rather than committed, so a local build needs no signing key.
          pnpm tauri build --target universal-apple-darwin --bundles app,dmg \
            --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Package the .app
        run: |
          cd src-tauri/target/universal-apple-darwin/release/bundle/macos
          ditto -c -k --keepParent Flux.app "Flux-${GITHUB_REF_NAME}-macos.zip"

      - name: Write the release notes
        run: |
          node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > release-notes.md
          cat release-notes.md

      # The updater reads from R2, not from this repository, which is private (ADR 0003).
      # This runs before the GitHub release so a tag never ends up announced but unpublished.
      # Packages go up first and the manifest last, so the soak starts from the moment the
      # files are actually downloadable (ADR 0004).
      - name: Publish the update
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BUCKET: flux-releases
        run: |
          set -euo pipefail
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_ACCOUNT_ID" ]; then
            echo "R2 credentials are missing; the update cannot be published" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          macos=src-tauri/target/universal-apple-darwin/release/bundle/macos
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          immutable="public, max-age=31536000, immutable"

          # the S3 API, because the token is scoped to this one bucket and the REST API that
          # wrangler speaks will not take such a token (it answers 403 on every object)
          put() { node scripts/r2.mjs put "$BUCKET" "$1" "$2" "$3" "$4"; }

          put "updates/$version/Flux.app.tar.gz" "$macos/Flux.app.tar.gz" application/gzip "$immutable"
          put "updates/$version/Flux_${version}_universal.dmg" "$dmg" application/x-apple-diskimage "$immutable"

          # the manifest being replaced carries the minimum version and the last releases' notes
          # forward, as scripts/release-local.sh does; without it every release forgot them
          previous="$(curl -fsS "https://updates.emreb.dev/updates/latest.json?x=$RANDOM" 2>/dev/null || echo '{}')"
          PREVIOUS_MANIFEST="$previous" RELEASE_NOTES="$(cat release-notes.md)" node scripts/manifest.mjs \
            "$version" "$macos/Flux.app.tar.gz.sig" \
            "https://updates.emreb.dev/updates/$version/Flux.app.tar.gz" 10 > latest.json
          cat latest.json
          put "updates/latest.json" latest.json application/json "public, max-age=60"

          # the version on offer and the one before it; anything older has nothing left to
          # serve, since the manifest only ever names one of them
          node scripts/r2.mjs prune "$BUCKET" 2

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Flux-*-macos.zip
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
      # as with the bucket: only the newest two releases keep their installers, so an old
      # version cannot be downloaded and installed from here
      - name: Prune the installers of older releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/prune-releases.sh 1
